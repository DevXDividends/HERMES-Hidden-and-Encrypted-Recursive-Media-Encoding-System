services:

  backend:
    build:
      context: ./backend
    container_name: hermes-backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: hermes-frontend

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://localhost:8000

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend